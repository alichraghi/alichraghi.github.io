<extend template="base.shtml">
<title id="title">Ali Cheraghi</title>
<head id="head"></head>
<main id="main">
  <section class="intro">
    <img src="$site.asset('art/pfp.png').link()" id="pfp" alt="Ali Cheraghi's profile artwork">
    <div>
      <h1>Ali Cheraghi</h1>
      <p>Independent software developer and team member of the <a href="https://ziglang.org">Zig</a> programming language.</p>
      <div id="social-links">
        <a href="mailto:alichraghi@proton.me">Email</a>
        <a href="https://codeberg.org/alichraghi">Codeberg</a>
        <a href="https://github.com/alichraghi">GitHub</a>
        <a href="https://hachyderm.io/@alic">Mastodon</a>
      </div>
    </div>
  </section>
  <div :html="$page.content()"></div>
  <section class="post-list">
    <h2>Latest writing</h2>
    <div class="post-entries" :loop="$site.page('blog').subpages()">
      <ctx :if="$loop.it.custom.getOr('visibility', 'public').eql('unlisted').not()">
        <a class="post-entry" href="$loop.it.link()">
          <time class="date" datetime="$loop.it.date.format('2006-01-02')" :text="$loop.it.date.format('January 02, 2006')"></time>
          <h3 :text="$loop.it.title"></h3>
        </a>
      </ctx>
    </div>
  </section>
</main>
